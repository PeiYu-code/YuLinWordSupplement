<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文單字配對測試</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>英文單字配對測試</h1>
    
    <div class="scoreboard">
      <div class="score-item">本回剩餘單字數: <span id="remaining-count">0</span></div>
      <div class="score-item">目前得分 (成功): <span id="success-score">0</span> | 錯誤次數: <span id="error-score">0</span></div>
    </div>

    <div class="match-area">
      <div class="column" id="english-column"></div>
      <div class="column" id="chinese-column"></div>
    </div>
  </div>

  <div id="result-modal" class="modal hidden">
    <div class="modal-content">
      <h2>測驗結束！</h2>
      <p>答對題數：<span id="final-success">0</span></p>
      <p>答錯次數：<span id="final-error">0</span></p>
      
      <div id="wrong-words-box" class="wrong-words-box" style="display: none;">
        <h3>答錯單字紀錄：</h3>
        <ul id="wrong-words-list"></ul>
      </div>

      <button id="restart-btn">再測一次</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
